
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 - Rata-rata Nilai</title>
</head>
<body>

    <h1>Latihan 1</h1>

    <form id="formNilai">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" required>
        <br><br>

        <label for="nim">NIM:</label>
        <input type="text" id="nim" required>
        <br><br>

        <h3>Nilai Percabangan</h3>

        <label for="nilaiIf">Nilai IF/ELSE:</label>
        <input type="number" id="nilaiIf" min="0" max="100" required>
        <br><br>

        <label for="nilaiSwitch">Nilai SWITCH CASE:</label>
        <input type="number" id="nilaiSwitch" min="0" max="100" required>
        <br><br>

        <h3>Nilai Operator</h3>

        <label for="nilaiOperator">Nilai Operator:</label>
        <input type="number" id="nilaiOperator" min="0" max="100" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <hr>

    <h2>Hasil Nilai</h2>
    <p id="data"></p>

    <script>
        const form = document.getElementById("formNilai");

        form.onsubmit = function(event) {
            event.preventDefault();

            // Mengambil data dari form
            const nama = document.getElementById("nama").value;
            const nim = document.getElementById("nim").value;

            const nilaiIf = Number(document.getElementById("nilaiIf").value);
            const nilaiSwitch = Number(document.getElementById("nilaiSwitch").value);
            const nilaiOperator = Number(document.getElementById("nilaiOperator").value);

            // Menghitung rata-rata menggunakan operator aritmatika
            const rataRata = (nilaiIf + nilaiSwitch + nilaiOperator) / 3;

            // Percabangan IF / ELSE IF / ELSE
            let predikat;

            if (rataRata >= 85) {
                predikat = "A - Sangat Baik";
            } else if (rataRata >= 70) {
                predikat = "B - Baik";
            } else if (rataRata >= 60) {
                predikat = "C - Cukup";
            } else {
                predikat = "D - Perlu Belajar Lagi";
            }

            // Operator perbandingan dan logika AND (&&)
            let keterangan;

            if (rataRata >= 70 && nilaiIf >= 60 && nilaiSwitch >= 60 && nilaiOperator >= 60) {
                keterangan = "Lulus";
            } else {
                keterangan = "Belum Lulus";
            }

            // Menampilkan hasil ke halaman
            const hasil = `
                Nama: ${nama}<br>
                NIM: ${nim}<br>
                Nilai IF/ELSE: ${nilaiIf}<br>
                Nilai SWITCH CASE: ${nilaiSwitch}<br>
                Nilai Operator: ${nilaiOperator}<br>
                <hr>
                Rata-rata Nilai: ${rataRata.toFixed(2)}<br>
                Predikat: ${predikat}<br>
                Keterangan: ${keterangan}
            `;

            document.getElementById("data").innerHTML = hasil;

            // Menampilkan hasil di console
            console.log("Nama:", nama);
            console.log("NIM:", nim);
            console.log("Rata-rata:", rataRata.toFixed(2));
            console.log("Predikat:", predikat);
            console.log("Keterangan:", keterangan);
        };
    </script>

</body>
</html>
